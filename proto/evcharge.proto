syntax = "proto3";

package evcharge;

// ─────────────────────────────────────────────
// ChargingService — implemented by charging_service.py
// ─────────────────────────────────────────────
service ChargingService {
  // Check whether a specific charger is available
  rpc CheckChargerAvailability (ChargerRequest)       returns (AvailabilityResponse);

  // Reserve a specific charger for an EV
  rpc ReserveCharger            (ReservationRequest)  returns (ReservationResponse);

  // Manually update a charger's status (e.g. mark as freed)
  rpc UpdateChargerStatus       (StatusUpdateRequest) returns (StatusUpdateResponse);
}

// ─────────────────────────────────────────────
// Shared: Lamport timestamp is carried in every
// message so both services can maintain their clocks.
// ─────────────────────────────────────────────

message ChargerRequest {
  string charger_id       = 1;   // e.g. "Charger_01"
  int64  lamport_timestamp = 2;
}

message AvailabilityResponse {
  string charger_id        = 1;
  bool   available         = 2;
  int64  lamport_timestamp = 3;
}

message ReservationRequest {
  string charger_id        = 1;
  string ev_id             = 2;   // e.g. "EV102"
  int64  lamport_timestamp = 3;
}

message ReservationResponse {
  bool   success           = 1;
  string message           = 2;
  int64  lamport_timestamp = 3;
}

message StatusUpdateRequest {
  string charger_id        = 1;
  string new_status        = 2;   // "AVAILABLE" | "OCCUPIED"
  int64  lamport_timestamp = 3;
}

message StatusUpdateResponse {
  bool   success           = 1;
  string message           = 2;
  int64  lamport_timestamp = 3;
}

// Experiment 4: Peer-to-peer distributed mutual exclusion
service MutexService {
  rpc RequestAccess (AccessRequest) returns (AccessReply);
}

message AccessRequest {
  int32 node_id = 1;
  int32 timestamp = 2;
}

message AccessReply {
  int32 node_id = 1;
  int32 timestamp = 2;
}

// Experiment 5: Deadlock simulation and resolution
service LockService {
  rpc AcquireLock (LockRequest) returns (LockReply);
  rpc ReleaseLock (LockRequest) returns (LockReply);
}

message LockRequest {
  string resource_id = 1;
  int32 holder_id = 2;
  int32 timestamp = 3;
}

message LockReply {
  bool granted = 1;
  string message = 2;
}