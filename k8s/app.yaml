# Replicated Worker Deployment with 5 replicas (> 3 replicas as required)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: myapp-backend:latest
        imagePullPolicy: Never
        command: ["python", "-u", "backend/load_worker.py", "60201"]
        ports:
        - containerPort: 60201
---
# Headless Service for worker to allow gRPC client-side round-robin DNS load balancing
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  clusterIP: None
  selector:
    app: worker
  ports:
  - port: 60201
    targetPort: 60201
