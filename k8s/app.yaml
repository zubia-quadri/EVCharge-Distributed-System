apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
      - name: service-a
        image: myapp-backend:latest
        imagePullPolicy: Never
        command: ["python", "-u", "peer_node.py", "A"]
        ports:
        - containerPort: 60401
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
spec:
  selector:
    app: service-a
  ports:
  - port: 60401
    targetPort: 60401
---
